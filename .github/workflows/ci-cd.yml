name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 1.3_python_data_processing/requirements.txt

      - name: Install dependencies
        run: pip install -r 1.3_python_data_processing/requirements.txt

      - name: Run tests
        run: python -m pytest
        env:
          PYTHONPATH: 1.3_python_data_processing/src

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy to lab
        run: |
          set -e
          cd ~/data_platform
          git pull --ff-only origin main
          compose_file=1.4_linux_git_docker/docker/docker-compose.yml
          docker compose -f "$compose_file" up -d --build
          docker compose -f "$compose_file" up -d --no-deps --force-recreate app
          docker image prune -f
          docker compose -f "$compose_file" ps -a