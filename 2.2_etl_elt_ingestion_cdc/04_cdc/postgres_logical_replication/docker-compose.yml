services:
  source:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: cdc_lab
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local lab password}
    ports:
      - "55432:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cdc_lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  target:
    image: postgres:16
    environment:
      POSTGRES_DB: cdc_lab
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local lab password}
    ports:
      - "55433:5432"
    volumes:
      - target_data:/var/lib/postgresql/data
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cdc_lab"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  source_data:
  target_data:
